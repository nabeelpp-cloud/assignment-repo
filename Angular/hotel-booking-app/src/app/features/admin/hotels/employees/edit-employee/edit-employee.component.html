<div class="main">
    <div class="formContainer">
      <form [formGroup]="updateEmployeeForm" (ngSubmit)="updateEmployee()">
        <div class="form-elements">
          <span class="label">Full Name</span>
          <input type="text" name="fullName" id="fullName" formControlName="fullName" />
          <span class="label">Email</span>
          <input type="text" name="email" id="email" formControlName="email" />
          <span class="label">Hotel Id</span>
          <input
            type="text"
            name="address"
            id="address"
            formControlName="hotelId"
            [readonly]="true"
          />
  
          <span class="label">Role</span>
          <input type="text" name="role" id="role" formControlName="role" />
          <input type="submit" value="Updated Employee" />
          <div class="cancel" (click)="goBack()">
            Cancel
          </div>
        </div>
      </form>
    </div>
  </div>
